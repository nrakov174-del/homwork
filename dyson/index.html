<!doctype html>
<html lang="ru" class="page">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dyson</title>
		<link rel="stylesheet" href="./css/index.css" />
		<link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
		<script defer src="./js/index.js" type="module"></script>
	</head>
	<body class="page-body">
		<header class="header">
			<div class="header__container container">
				<button
					aria-expanded="false"
					class="header__burger burger"
					aria-label="меню"
					title="меню"
					aria-controls="header__menu"
				>
					<svg width="50" height="50" viewBox="0 0 50 50">
						<use
							class="burger__icon-menu"
							href="./icon/sprite.svg#burger-menu"
						></use>
						<use
							class="burger__icon-cross"
							href="./icon/sprite.svg#menu-cross"
						></use>
					</svg>
				</button>
				<a href="#" class="header__logo">
					<img
						class="header__logo-img"
						src="./icon/logo-icon.png"
						alt="логотип фирмы Dyson"
						width="183"
						height="77"
					/>
				</a>
				<nav
					class="header__menu header__menu"
					id="header__menu"
					aria-label="главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#Company-information" class="menu__link">О нас</a>
						</li>
						<li class="menu__item">
							<a href="#delivery-payment" class="menu__link"
								>Доставка и оплата</a
							>
						</li>
						<li class="menu__item">
							<a href="#product-registration" class="menu__link"
								>Регистрация продукта</a
							>
						</li>
						<li class="menu__item">
							<a href="#service" class="menu__link">Сервис</a>
						</li>
						<li class="menu__item">
							<a href="#licenses-certificates" class="menu__link"
								>Сертификаты и лицензии</a
							>
						</li>
					</ul>
				</nav>
				<button
					class="header__basket basket"
					aria-label="корзина товаров"
					title="корзина товаров"
				>
					<svg width="36" height="36" viewBox="0 0 36 36">
						<use
							class="basket__icon-menu"
							href="./icon/sprite.svg#basket"
						></use>
					</svg>
				</button>
			</div>
		</header>
	</body>
</html>
