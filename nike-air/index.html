<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="shortcut icon"
			href="./icon/nike-favicon-48x48.ico"
			type="image/x-icon"
		/>
		<link rel="stylesheet" href="./css/index.css" />
		<script src="./js/index.js" type="module"></script>
		<title>Nike Air Mag</title>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<a href="/" class="logo header__logo">
					<img
						class="logo-img"
						src="./icon/logo-icon.svg"
						alt="логотип найки"
						width="50"
						height="20"
					/>
				</a>
				<nav
					class="menu header__menu"
					id="header__menu"
					aria-label="Главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#air-mag" class="menu__link" lang="en">Air Mag</a>
						</li>
						<li class="menu__item">
							<a href="#sizes" class="menu__link">Размеры</a>
						</li>
						<li class="menu__item">
							<a href="#characteristics" class="menu__link">Характеристики</a>
						</li>
						<li class="menu__item">
							<a href="#top-model" class="menu__link">Другие ТОП модели</a>
						</li>
					</ul>
				</nav>
				<div class="header__controls">
					<a href="#" class="header__order">Сделать заказ</a>
					<div class="header__actions">
						<button
							class="header__actions-button"
							aria-label="Поиск"
							title="Корзина"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icon/sprite.svg#search"
								></use>
							</svg>
						</button>
						<button
							aria-label="Корзина"
							title="Корзина"
							class="header__actions-button"
						>
							<svg width="24" height="24">
								<use
									class="header__actions-icon"
									href="./icon/sprite.svg#card"
								></use>
							</svg>
						</button>
						<button
							class="header__burrer burger"
							aria-label="меню"
							aria-expanded="false"
							aria-controls="header__menu"
							title="меню"
						>
							<svg width="24" height="24">
								<use
									class="burger__icon-menu"
									href="./icon/sprite.svg#menu-burger"
								></use>
								<use
									class="burger__icon-cross"
									href="./icon/sprite.svg#menu-cross"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="hero__container container">
					<header class="hero__header">
						<ul class="hero__benefits-list">
							<li class="hero__benefits-item">стиль</li>
							<li class="hero__benefits-item">скорость</li>
						</ul>
						<h1 class="hero__title">
							Nike <span class="hero__title-accent">air</span> Mag
						</h1>
					</header>
					<img
						src="./images/nike-air-1.png"
						alt="Кроссовка Nike с желтым кольцом на подошве"
						class="hero__img"
						width="846"
						height="713"
					/>
					<footer class="hero__footer">
						<a href="/" class="hero__details">
							Подробнее
							<svg width="24" height="24">
								<use
									class="hero__details-icon"
									href="./icon/main-sprite.svg#arrow-right"
								></use>
							</svg>
						</a>
					</footer>
				</div>
			</section>
		</main>
	</body>
</html>
